[project]
name = "tiptoi-dl"
version = "1.0.1"
description = "A TipToi Download helper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.14.2",
    "beautifulsoup4>=4.14.2",
    "coloredlogs>=15.0.1",
    "httpx>=0.28.1",
    "psutil>=7.1.0",
    "requests>=2.32.5",
    "textual>=8.2.8",
    "tqdm>=4.67.1",
]

[project.scripts]
tiptoi-dl = "tiptoi_dl.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiptoi_dl"]

[tool.hatch.build.targets.sdist]
exclude = ["/demo.gif", "/demo.tape", "/.github"]
