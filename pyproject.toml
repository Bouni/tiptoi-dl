[project]
name = "tiptoi-dl"
version = "1.2.0"
description = "A TipToi Download helper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.14.2",
    "httpx>=0.28.1",
    "psutil>=7.1.0",
    "textual>=8.2.8",
]

[dependency-groups]
# Only used by .github/scripts/generate.py (catalog scraper), not shipped
catalog = [
    "httpx>=0.28.1",
    "selectolax>=1.0.2",
]

[project.scripts]
tiptoi-dl = "tiptoi_dl.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiptoi_dl"]

[tool.hatch.build.targets.sdist]
exclude = ["/demo.gif", "/demo.tape", "/.github"]
