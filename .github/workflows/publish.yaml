name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: build and publish
    runs-on: ubuntu-latest

    # Must match the environment configured for the trusted publisher on PyPI
    environment:
      name: pypi
      url: https://pypi.org/p/tiptoi-dl

    permissions:
      id-token: write   # required for PyPI trusted publishing

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Check release tag matches project version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(uv version --short)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag ($GITHUB_REF_NAME) does not match pyproject.toml version ($VERSION)"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish --trusted-publishing always
